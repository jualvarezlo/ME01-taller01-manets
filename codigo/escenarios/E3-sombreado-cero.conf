# Escenario E3 — Sin sombreado
#
# Taller 01 MANETs, literal f. Apaga el sombreado del canal (base.conf usa 4 dB). Sin sombreado el
# canal es casi determinista: el ajuste RSSI vs distancia recupera el exponente real (2.7) y
# desaparece el sesgo de las lecturas lejanas. Sirve de referencia "limpia" para ver cuánto del error
# viene del ruido del canal y cuánto de la geometría de la movilidad.
#
# E3 tiene dos niveles (cero y alto). Correr ambos:
#   python analisis/experimento.py --nombre E3-sombreado-cero --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E3-sombreado-cero.conf
#   python analisis/experimento.py --nombre E3-sombreado-alto --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E3-sombreado-alto.conf

simTime = 600
nodesPerCluster = 8
shadowSigmaDb = 0
zoneFusion = none
estMethod = trilateracion
