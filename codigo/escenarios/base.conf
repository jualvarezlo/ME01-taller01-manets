# Parámetros de collar-sim con sus valores por defecto.
#
# Para probar otro escenario: copiar este archivo (p. ej. escenarios/mi-escenario.conf), cambiar lo que
# haga falta (se pueden borrar las líneas que no cambian) y correr con --conf:
#
#   ~/tools/ns-allinone-3.46.1/ns-3.46.1/build/scratch/manets/ns3.46.1-collar-sim-default \
#       --conf=$PWD/escenarios/mi-escenario.conf --outDir=$PWD/resultados/mi-escenario
#
#   ~/tools/ns3ai-venv/bin/python analisis/experimento.py --nombre mi-escenario --reps 10 \
#       -- --conf=escenarios/mi-escenario.conf
#
# Formato: «clave = valor», '#' comenta. Lo que se pase en la línea de comandos DESPUÉS de --conf gana.
# En experimento.py, los factores del diseño (clusterMobility, nodeMobility, routing, RngRun, outDir) los
# pone el script y ganan sobre este archivo; en ns3ai_estimador.py, estimator y ns3aiTrial también.
# Booleanos: true / false. La lista completa, siempre al día: el binario con --help.

# ---------------------------------------------------------------- movilidad (variables del factorial)
clusterMobility = true      # ¿se mueven los clústeres (nivel 1)?
nodeMobility = true         # ¿se mueven los celulares dentro de su clúster?

# ---------------------------------------------------------------- tamaño y duración
nodesPerCluster = 8         # celulares por clúster (4 clústeres; mínimo 2: cabeza + dueño)
simTime = 600               # s

# ---------------------------------------------------------------- clústeres
busSpeed = 6                # m/s
busDwell = 20               # s de parada en cada esquina de la ruta
groupSpeedMin = 0.5         # m/s, grupos a pie (plaza, paseador)
groupSpeedMax = 1.5         # m/s
groupPause = 30             # s, pausa máxima entre destinos

# ---------------------------------------------------------------- perro perdido
dogMobility = true
dogX = 300                  # m, posición inicial (área 500 x 300; zona sur y < 150)
dogY = 140
dogSpeed = 0.3              # m/s

# ---------------------------------------------------------------- collar y radio
beaconInterval = 1          # s entre beacons
beaconSize = 32             # bytes
collarTxDbm = 0             # dBm
phoneTxDbm = 16             # dBm
rxSensitivityDbm = -95      # dBm
phoneDataMode = DsssRate1Mbps   # DsssRate1Mbps | DsssRate2Mbps | DsssRate5_5Mbps | DsssRate11Mbps

# ---------------------------------------------------------------- canal (componente estocástico)
pathLossExp = 2.7           # exponente log-distancia
refLossDb = 40.05           # dB de pérdida a 1 m (2.4 GHz)
shadowSigmaDb = 4           # dB; 0 = sin sombreado
gpsSigma = 4                # m de error GPS por eje

# ---------------------------------------------------------------- red
routing = aodv              # aodv | olsr | dsdv
arpQueue = 64               # paquetes por vecino sin resolver (ns-3 trae 3; ver README)
reportJitterMs = 100        # ms máximos de espera aleatoria antes de enviar una lectura

# ---------------------------------------------------------------- estimación y consultas
estMethod = trilateracion   # cercano | centroide | trilateracion
estimator = cpp             # cpp | python (python solo lanzando con analisis/ns3ai_estimador.py)
estWindow = 10              # s de lecturas que usa cada estimación
estInterval = 5             # s entre estimaciones de cada cabeza de zona
zoneFusion = none           # none | raw (reenviar lecturas crudas) | merge (promediar estimaciones)
queryInterval = 10          # s promedio entre consultas del dueño (uniforme entre 0.5x y 1.5x)
queryStart = 20             # s
ownerCluster = 0            # 0 bus-norte | 1 plaza | 2 bus-sur | 3 paseador

# ---------------------------------------------------------------- salida
posLogInterval = 1          # s entre registros de posiciones
netanim = false             # escribir netanim.xml
