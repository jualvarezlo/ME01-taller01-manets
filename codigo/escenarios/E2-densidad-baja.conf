# Escenario E2 — Densidad baja
#
# Taller 01 MANETs, literal f. Varía la densidad de observadores por clúster frente al caso base
# (base.conf usa 8). Con pocos observadores se pone a prueba si la escasez de lecturas degrada la
# localización y si la trilateración pierde disponibilidad (necesita >= 3 observadores distintos).
#
# E2 tiene dos niveles (baja y alta); este es el nivel BAJO. Correr ambos:
#   python analisis/experimento.py --nombre E2-densidad-baja --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E2-densidad-baja.conf
#   python analisis/experimento.py --nombre E2-densidad-alta --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E2-densidad-alta.conf

simTime = 600
nodesPerCluster = 4
shadowSigmaDb = 4
zoneFusion = none
estMethod = trilateracion
