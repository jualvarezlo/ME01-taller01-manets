# Escenario E2 — Densidad alta
#
# Taller 01 MANETs, literal f. Nivel ALTO de densidad de observadores por clúster (base.conf usa 8).
# Con muchos observadores se pone a prueba si más lecturas compensan la mala geometría de los
# clústeres tipo bus, donde los celulares están casi en el mismo punto.
#
# E2 tiene dos niveles (baja y alta); este es el nivel ALTO. Correr ambos:
#   python analisis/experimento.py --nombre E2-densidad-baja --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E2-densidad-baja.conf
#   python analisis/experimento.py --nombre E2-densidad-alta --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E2-densidad-alta.conf

simTime = 600
nodesPerCluster = 16
shadowSigmaDb = 4
zoneFusion = none
estMethod = trilateracion
