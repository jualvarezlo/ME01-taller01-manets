# Escenario E3 — Sombreado alto
#
# Taller 01 MANETs, literal f. Sube el sombreado del canal al doble del caso base (base.conf usa
# 4 dB). Con más ruido log-normal, el RSSI de dos lecturas a la misma distancia varía más, lo que
# pone a prueba si el patrón de movilidad que ganaba sin ruido sigue ganando cuando el canal es más
# incierto. Se contrasta con E3-sombreado-cero.
#
# E3 tiene dos niveles (cero y alto). Correr ambos:
#   python analisis/experimento.py --nombre E3-sombreado-cero --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E3-sombreado-cero.conf
#   python analisis/experimento.py --nombre E3-sombreado-alto --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E3-sombreado-alto.conf

simTime = 600
nodesPerCluster = 8
shadowSigmaDb = 8
zoneFusion = none
estMethod = trilateracion
