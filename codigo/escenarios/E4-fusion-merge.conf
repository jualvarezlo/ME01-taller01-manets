# Escenario E4 — Fusión de zonas: merge
#
# Taller 01 MANETs, literal f. Tercera opción de combinación de zonas (base.conf usa none). Con
# merge, cada cabeza de zona estima por su lado y, al contestar una consulta, se promedian las dos
# estimaciones ponderando por número de observadores. Es un punto intermedio entre none (sin
# compartir) y raw (compartir todas las lecturas crudas).
#
# E4 compara las tres opciones de zoneFusion. El nivel none es el caso base (E1); aquí van raw y
# merge. Correr:
#   python analisis/experimento.py --nombre E4-fusion-raw   --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E4-fusion-raw.conf
#   python analisis/experimento.py --nombre E4-fusion-merge --reps 10 --routing aodv olsr dsdv -- --conf=escenarios/E4-fusion-merge.conf
# (el nivel none ya queda cubierto por E1)

simTime = 600
nodesPerCluster = 8
shadowSigmaDb = 4
zoneFusion = merge
estMethod = trilateracion
